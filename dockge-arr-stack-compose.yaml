# *arr stack as ONE Dockge stack (arr-complete.sh writes one stack per
# container instead and configures everything; see
# wiki.serversatho.me/en/Folder-Structure).
# Set these in the stack's .env in Dockge before deploying:
#   TZ=America/New_York
#   CONFIG_PATH=/mnt/tank/configs   (one folder per app inside)
#   MEDIA_PATH=/mnt/tank/media      (movies, tv, downloads)
#   LAN=192.168.1.0/24              (your LAN subnet, for qBittorrent's VPN bypass)
# qBittorrent needs a WireGuard config at ${CONFIG_PATH}/qbittorrent/wireguard/wg0.conf.
# Seerr runs as 568 here, so chown -R 568:568 ${CONFIG_PATH}/seerr.
services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=568
      - PGID=568
      - TZ=${TZ}
    volumes:
      - ${CONFIG_PATH}/prowlarr/:/config
      - ${MEDIA_PATH}:/media/  
    ports:
      - 9696:9696
    restart: unless-stopped
    
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=568
      - PGID=568
      - TZ=${TZ}
    volumes:
      - ${CONFIG_PATH}/radarr/:/config
      - ${MEDIA_PATH}:/media  
    ports:
      - 7878:7878
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=568
      - PGID=568
      - TZ=${TZ}
    volumes:
      - ${CONFIG_PATH}/sonarr/:/config
      - ${MEDIA_PATH}:/media  
    ports:
      - 8989:8989
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    user: "568:568"
    container_name: seerr
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ}
      - PORT=5055
    ports:
      - 5055:5055
    volumes:
      - ${CONFIG_PATH}/seerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=568
      - PGID=568
      - TZ=${TZ}
    volumes:
      - ${CONFIG_PATH}/jellyfin:/config
      - ${MEDIA_PATH}:/media  
    ports:
      - 8096:8096
    restart: unless-stopped
    
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=${TZ}
    ports:
      - 8191:8191
    restart: unless-stopped

  qbittorrent:
    container_name: qbittorrent
    image: ghcr.io/hotio/qbittorrent:latest
    restart: unless-stopped
    ports:
      - 8080:8080
    environment:
      - PUID=568
      - PGID=568
      - UMASK=002
      - TZ=${TZ}
      - WEBUI_PORTS=8080/tcp
      - VPN_ENABLED=true
      - VPN_CONF=wg0
      - VPN_PROVIDER=generic
      - VPN_LAN_NETWORK=${LAN}
      - VPN_LAN_LEAK_ENABLED=false
      - VPN_EXPOSE_PORTS_ON_LAN=
      - VPN_AUTO_PORT_FORWARD=false # or your forwarded port number
      - VPN_PORT_REDIRECTS=
      - VPN_HEALTHCHECK_ENABLED=false
      - VPN_NAMESERVERS=wg
      - VPN_INTERFACE_PREFIXES=
      - PRIVOXY_ENABLED=false
      - UNBOUND_ENABLED=false
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=1
    volumes:
      - ${CONFIG_PATH}/qbittorrent/:/config
      - ${MEDIA_PATH}:/media  

  qui:
    image: ghcr.io/autobrr/qui:latest
    container_name: qui
    user: "568:568"
    restart: unless-stopped
    ports:
      - "7476:7476"
    volumes:
      - ${CONFIG_PATH}/qui/:/config
      - ${MEDIA_PATH}:/media  

  profilarr:
    image: ghcr.io/dictionarry-hub/profilarr:latest
    container_name: profilarr
    restart: unless-stopped
    ports:
      - "6868:6868"
    volumes:
      - ${CONFIG_PATH}/profilarr:/config
    environment:
      - PUID=568
      - PGID=568
      - UMASK=022
      - TZ=${TZ}

  watchtower:
    image: nickfedor/watchtower
    container_name: watchtower
    environment:
      - TZ=${TZ}
      - WATCHTOWER_NOTIFICATIONS_HOSTNAME=truenas
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_SCHEDULE=0 0 3 * * *
      # Never update TrueNAS catalog apps (their containers are named ix-*).
      - WATCHTOWER_DISABLE_CONTAINERS=^ix-.*
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  dozzle:
    container_name: dozzle
    image: amir20/dozzle:latest
    # Dozzle 11+ keeps users and settings in /data. 999 is the group that owns
    # the Docker socket on TrueNAS (stat -c %g /var/run/docker.sock).
    user: "568:568"
    group_add:
      - "999"
    environment:
      - TZ=${TZ}
    ports:
      - '8888:8080'
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CONFIG_PATH}/dozzle:/data
      - /proc:/host/proc:ro
      
